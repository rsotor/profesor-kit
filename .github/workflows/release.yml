name: release
# Cada merge a main con una versión nueva en .kit/VERSION publica su release (etiqueta vX.Y.Z). Es lo que
# `actualizar.js` descarga en los cursos: a los alumnos solo les llega lo publicado, nunca main a secas.
# Si la etiqueta ya existe (un merge que no cambia la versión), no hace nada.
# Solo después de que el workflow `tests` termine en verde en main, y con ese mismo commit (issue #39, H10): una
# release nunca sale de un commit que no ha pasado los tests.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Las Actions van fijadas por su commit (con la versión al lado), no por una etiqueta que puede moverse.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: version
        run: echo "v=$(tr -d '[:space:]' < .kit/VERSION)" >> "$GITHUB_OUTPUT"
      - id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.v }}" >/dev/null 2>&1; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "si=0" >> "$GITHUB_OUTPUT"; fi
      # Las notas son la sección de esa versión en el CHANGELOG (escrito para el alumno).
      - if: steps.existe.outputs.si == '0'
        run: node .github/release-notas.js "${{ steps.version.outputs.v }}" > notas.md
      - if: steps.existe.outputs.si == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.v }}" --title "v${{ steps.version.outputs.v }}" --notes-file notas.md --target "${{ github.event.workflow_run.head_sha }}"
