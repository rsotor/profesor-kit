name: informe
# Rehace el issue «Informe de mantenimiento» fuera de la noche, cuando cambia lo que espera a Roberto: se cierra un
# PR del bot o un issue, o cambia una etiqueta. Sin LLM ni aviso por email (el aviso es solo de la pasada nocturna).
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed, labeled, unlabeled]

concurrency:
  group: informe
  cancel-in-progress: true

permissions: {}

jobs:
  rehacer:
    if: >
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'claude/issue-') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' && !startsWith(github.event.issue.title, 'Informe de mantenimiento'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - run: node .github/cola-nocturna.js --informe --sin-aviso
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CLAUDE_NOCTURNO: ${{ vars.CLAUDE_NOCTURNO }}
