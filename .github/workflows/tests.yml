name: tests
on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela el run anterior: no se gastan minutos en resultados que nadie va a mirar.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  herramientas:
    # Sin macOS a propósito: cuesta 10 minutos facturables por minuto, y los tests ya corren en el Mac de
    # quien desarrolla antes de cada push (hook .githooks/pre-push). Windows (x2) se queda porque es el
    # sistema que no tenemos a mano; Linux (x1) cubre las dos versiones de Node.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global core.autocrlf false
      # Falla si algún test falla O si la cobertura de las herramientas baja del 80 %.
      - run: >
          node --test --experimental-test-coverage
          --test-coverage-include=".kit/herramientas/**"
          --test-coverage-exclude=".kit/herramientas/tests/**"
          --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=80
          ".kit/herramientas/tests/*.test.js"
      - run: node .kit/herramientas/comprobar.js

  # Un único check que resume toda la matriz: es el que se marca como obligatorio en la regla de main.
  tests-ok:
    if: always()
    needs: herramientas
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.herramientas.result }}" = "success"
