name: tests
on:
  # `edited`: al cambiar el título del PR se repite el check del título (y con él, el resto).
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela el run anterior: no se gastan minutos en resultados que nadie va a mirar.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  herramientas:
    # Los dos sistemas soportados (Mac y Windows) y Linux, que no se soporta pero es donde corren el linter y
    # las comprobaciones de una sola vez. En un repo público los runners son gratis, también los de macOS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth 0 (con sus etiquetas): lo necesitan cambio-grande.js (comparar con la rama base) y
      # prueba-actualizar.js (reconstruir la release anterior, con su curso de ejemplo, con `git archive`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global core.autocrlf false
      # El linter solo en un job (Linux, Node 24): no aporta nada repetirlo en toda la matriz y gasta minutos.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm ci
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run lint
      # Falla si algún test falla O si la cobertura de las herramientas baja del 80 %.
      - run: >
          node --test --experimental-test-coverage
          --test-coverage-include=".kit/herramientas/**"
          --test-coverage-exclude=".kit/herramientas/tests/**"
          --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=80
          ".kit/herramientas/tests/*.test.js"
      - run: node .kit/herramientas/comprobar.js
      # Sin LLM: solo mecánica de ficheros y git. Por eso, a diferencia de prueba-real.js, sí corre aquí.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run prueba-actualizar
      # Recuerda la prueba real cuando el PR toca cómo trabaja el profesor (solo en pull_request: en un
      # push a main ya no hay "rama base" con la que comparar).
      - if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node .github/cambio-grande.js
      # El título del PR es el commit en main: dice si publica versión y cuadra con .kit/VERSION.
      - if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == 24
        env:
          TITULO_PR: ${{ github.event.pull_request.title }}
        run: node .github/titulo-pr.js

  # Un único check que resume toda la matriz: es el que se marca como obligatorio en la regla de main.
  tests-ok:
    if: always()
    needs: herramientas
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.herramientas.result }}" = "success"
