name: Propuesta de mejora
description: Algo que echas en falta o que funcionaría mejor de otra forma.
title: "[mejora] "
labels: ["mejora"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠ **Nunca pegues material de tu curso ni datos personales.** Si hace falta un ejemplo, invéntalo.
  - type: textarea
    id: problema
    attributes:
      label: Qué problema quieres resolver
      description: Cuéntalo desde cómo estudias, no desde la solución. Ej. «antes del examen no sé qué repasar primero».
    validations: { required: true }
  - type: textarea
    id: propuesta
    attributes:
      label: Cómo te lo imaginas
  - type: dropdown
    id: parte
    attributes:
      label: Parte del kit
      options: [Instalación, Preparar una clase, Dudas, Ejercicios, Exámenes, Repasos, Progreso, Obsidian, Actualizar, Otra]
