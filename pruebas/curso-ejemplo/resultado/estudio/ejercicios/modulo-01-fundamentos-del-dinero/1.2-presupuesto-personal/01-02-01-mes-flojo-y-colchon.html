<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un mes flojo y el colchón</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8886; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
  h2 { margin: 0 0 .5rem; font-size: 1.05rem; }
  label { display: block; margin: .6rem 0 .1rem; }
  input[type=range] { width: 100%; }
  button { font: inherit; padding: .4rem .9rem; margin: .3rem .3rem 0 0; }
  #explicacion { min-height: 3rem; }
</style>
</head>
<body>
<h1>Un mes flojo y el colchón</h1>
<p>Conceptos: <a href="../../../conceptos/presupuesto.md">presupuesto</a> · <a href="../../../conceptos/colchon-financiero.md">colchon-financiero</a></p>

<section>
  <h2>1 · Condiciones</h2>
  <label for="ingresos">Ingresos de este mes: <strong id="ingresosTxt"></strong></label>
  <input type="range" id="ingresos" min="500" max="2500" step="50" value="1300">
  <label for="gastos">Gastos de este mes: <strong id="gastosTxt"></strong></label>
  <input type="range" id="gastos" min="800" max="1800" step="5" value="1195">
  <label for="meses">Colchón guardado: <strong id="mesesTxt"></strong></label>
  <input type="range" id="meses" min="0" max="6" step="1" value="3">
</section>

<section>
  <h2>2 · Reto</h2>
  <p id="pregunta"></p>
  <button type="button" data-r="ahorro">Me sobra dinero: ahorro</button>
  <button type="button" data-r="justo">Cierro el mes justo, en cero</button>
  <button type="button" data-r="colchon">Me falta: tiro del colchón</button>
</section>

<section>
  <h2>3 · Explicación</h2>
  <p id="explicacion">Elige una respuesta y aquí verás por qué.</p>
</section>

<script>
function euros(n) { return n.toFixed(2).replace('.', ',') + ' €'; }
function num1(n) { return n.toFixed(1).replace('.', ','); }

window.verificar = function (caso) {
  if (caso.ingresos > caso.gastos) { return 'ahorro'; }
  if (caso.ingresos === caso.gastos) { return 'justo'; }
  return 'colchon';
};

function leer() {
  return {
    ingresos: Number(document.getElementById('ingresos').value),
    gastos: Number(document.getElementById('gastos').value),
    meses: Number(document.getElementById('meses').value)
  };
}

function pintar() {
  var c = leer();
  document.getElementById('ingresosTxt').textContent = euros(c.ingresos);
  document.getElementById('gastosTxt').textContent = euros(c.gastos);
  document.getElementById('mesesTxt').textContent = c.meses + (c.meses === 1 ? ' mes de gastos' : ' meses de gastos');
  document.getElementById('pregunta').textContent = 'Este mes entran ' + euros(c.ingresos) + ' y salen ' + euros(c.gastos)
    + '. Tienes un colchón de ' + c.meses + (c.meses === 1 ? ' mes' : ' meses') + ' de gastos. ¿Qué pasa con el mes? (elige una)';
  document.getElementById('explicacion').textContent = 'Elige una respuesta y aquí verás por qué.';
}

function responder(r) {
  var c = leer();
  var correcta = window.verificar(c);
  var dif = c.ingresos - c.gastos;
  var txt = r === correcta ? '✔ Correcto. ' : '✘ No. ';
  if (correcta === 'ahorro') {
    txt += 'Ahorro del mes = ingresos − gastos = ' + euros(c.ingresos) + ' − ' + euros(c.gastos) + ' = ' + euros(dif)
      + ', una tasa de ahorro de ' + num1(dif / c.ingresos * 100) + ' % mensual. Baja los ingresos hasta igualar los gastos y verás cambiar el veredicto.';
  } else if (correcta === 'justo') {
    txt += 'Ingresos y gastos son iguales (' + euros(c.ingresos) + '): el ahorro del mes es 0,00 €. Es el punto exacto donde cambia el veredicto: un euro menos de ingresos y ya falta dinero.';
  } else {
    var falta = c.gastos - c.ingresos;
    var colchon = c.meses * c.gastos;
    txt += 'Faltan ' + euros(falta) + ' para cubrir los gastos. ';
    if (c.meses === 0) {
      txt += 'Sin colchón no hay de dónde sacarlo: habría que endeudarse o dejar de pagar algo. Sube el colchón y mira la diferencia.';
    } else {
      txt += 'Tu colchón es ' + euros(colchon) + ' (' + c.meses + ' × ' + euros(c.gastos) + ') y cubre ese hueco '
        + Math.floor(colchon / falta) + ' meses seguidos como este.';
    }
  }
  document.getElementById('explicacion').textContent = txt;
}

['ingresos', 'gastos', 'meses'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', pintar);
});
document.querySelectorAll('button[data-r]').forEach(function (b) {
  b.addEventListener('click', function () { responder(b.getAttribute('data-r')); });
});
pintar();
</script>
</body>
</html>
