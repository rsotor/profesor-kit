<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuánto paga el colchón?</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8884; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  h3 { margin: 2rem 0 0; }
  table { border-collapse: collapse; }
  td { padding: .15rem .8rem .15rem 0; }
  button { display: block; width: 100%; text-align: left; font: inherit; padding: .5rem .9rem; margin: .3rem 0; border-radius: 6px; border: 1px solid #8888; cursor: pointer; }
  .bien { background: #2e7d3240; }
  .mal { background: #c6282840; }
  .vacio { opacity: .7; }
</style>
</head>
<body>
<h1>¿Cuánto paga el colchón?</h1>
<p>Concepto: <a href="../../../conceptos/colchon-financiero.md">colchón financiero</a> · Sesión 01-02-01.
Tres casos, cada uno con sus condiciones. Elige antes de ver la explicación: en cada caso cambia algo
distinto.</p>
<div id="casos"></div>

<script>
const eur = n => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const num = n => String(n).replace(".", ",");

// Cada caso: condiciones, pregunta (una sola cosa), opciones y cuál es la correcta.
// Las cifras de las opciones y de la explicación salen de las condiciones.
const CASOS = [
  { g: 1000, c: 3000, i: 400,
    pregunta: "¿Cuántos meses flojos seguidos aguanta el colchón? (una cifra de meses)",
    opciones: s => [s.c / s.g, s.c / (s.g - s.i), s.c / s.i],
    correcta: s => s.c / (s.g - s.i),
    unidad: " meses",
    explica: s => "Cada mes flojo faltan " + eur(s.g) + " − " + eur(s.i) + " = " + eur(s.g - s.i) +
      ". Con " + eur(s.c) + " de colchón: " + eur(s.c) + " ÷ " + eur(s.g - s.i) + " = " + num(s.c / (s.g - s.i)) +
      " meses. Dividir entre los gastos (" + num(s.c / s.g) + " meses) supone que no entra nada; dividir entre lo que ingresas no tiene sentido: eso ya lo cubres." },
  { g: 900, c: 2700, i: 900,
    pregunta: "¿Cuánto colchón gastas cada mes flojo? (una cifra)",
    opciones: s => [s.g, 0, 200],
    correcta: s => 0,
    unidad: "€",
    explica: s => "Lo que entra (" + eur(s.i) + ") cubre los gastos (" + eur(s.g) + "): la diferencia es " + eur(0) +
      ". El colchón no se toca, así que no tiene sentido decir que \"dura 3 meses\": esa cuenta solo vale cuando falta dinero cada mes." },
  { g: 1200, c: 7200, i: 0,
    pregunta: "¿Cuántos meses aguanta el colchón? (una cifra de meses)",
    opciones: s => [s.c / s.g, s.c / (s.g - 300), s.c / 1000],
    correcta: s => s.c / s.g,
    unidad: " meses",
    explica: s => "Aquí no entra nada, así que falta el gasto entero: " + eur(s.g) + " − " + eur(0) + " = " + eur(s.g) +
      ". Por eso " + eur(s.c) + " ÷ " + eur(s.g) + " = " + num(s.c / s.g) + " meses. \"Colchón ÷ gastos\" es el caso particular de ingresar cero." }
];

function condiciones(s) {
  let f = "<tr><td>Gastos al mes</td><td><b>" + eur(s.g) + "</b></td></tr>";
  if (s.c !== null) f += "<tr><td>Colchón guardado</td><td><b>" + eur(s.c) + "</b></td></tr>";
  f += "<tr><td>Lo que ingresas cada mes flojo</td><td><b>" + eur(s.i) + "</b></td></tr>";
  return "<table>" + f + "</table>";
}
function formato(s, v, unidad) { return unidad === "€" ? eur(v) : num(Math.round(v * 10) / 10) + unidad; }

CASOS.forEach((s, k) => {
  const cont = document.createElement("div");
  const ops = s.opciones(s), ok = s.correcta(s);
  // Orden de opciones fijo pero repartido, para que la correcta no sea siempre la misma.
  const orden = [[0, 1, 2], [2, 0, 1], [1, 2, 0], [1, 0, 2]][k];
  cont.innerHTML = "<h3>Caso " + (k + 1) + "</h3>" +
    "<section><h2>Condiciones</h2>" + condiciones(s) + "</section>" +
    "<section><h2>Reto</h2><p>" + s.pregunta + "</p><div class='ops'></div></section>" +
    "<section><h2>Explicación</h2><p class='expl vacio'>Elige una respuesta y aquí verás por qué.</p></section>";
  const caja = cont.querySelector(".ops"), expl = cont.querySelector(".expl");
  orden.forEach(idx => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = formato(s, ops[idx], s.unidad);
    b.onclick = () => {
      const acierto = ops[idx] === ok;
      b.className = acierto ? "bien" : "mal";
      expl.className = "expl";
      expl.textContent = (acierto ? "Correcto. " : "No. ") + s.explica(s);
    };
    caja.appendChild(b);
  });
  document.getElementById("casos").appendChild(cont);
});
</script>
</body>
</html>
