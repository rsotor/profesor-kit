<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuánto tarda en perder la mitad?</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  h2 { margin-top: 0; font-size: 1.1rem; }
  input[type=range] { width: 100%; }
  button { font: inherit; padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; }
  #explicacion { min-height: 3rem; }
</style>
</head>
<body>
<h1>¿Cuánto tarda en perder la mitad?</h1>
<p>Concepto: <a href="../../../conceptos/inflacion.md">inflación</a>.</p>

<section id="condiciones">
  <h2>1 · Condiciones</h2>
  <p>Tienes <strong id="ahorro-txt">1.000,00 €</strong> guardados en el cajón, sin moverlos.</p>
  <label for="inflacion">Inflación anual: <strong id="inflacion-txt">3,0 % anual</strong></label>
  <input type="range" id="inflacion" min="1" max="30" step="0.5" value="3">
  <input type="hidden" id="ahorro" value="1000">
</section>

<section id="reto">
  <h2>2 · Reto</h2>
  <p>Con esa inflación, ¿en cuántos años tu dinero compra menos de la mitad que hoy? (elige una opción)</p>
  <button data-op="pocos">Menos de 5 años</button>
  <button data-op="medios">Entre 5 y 15 años</button>
  <button data-op="muchos">Más de 15 años</button>
</section>

<section id="explicacion-s">
  <h2>3 · Explicación</h2>
  <div id="explicacion">Elige una respuesta y aquí verás por qué.</div>
</section>

<script>
function anios(i) { return Math.log(2) / Math.log(1 + i / 100); }
window.verificar = function (caso) {
  var a = anios(Number(caso.inflacion));
  return a < 5 ? 'pocos' : (a <= 15 ? 'medios' : 'muchos');
};
function eur(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function pct(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' % anual'; }
var nombres = { pocos: 'menos de 5 años', medios: 'entre 5 y 15 años', muchos: 'más de 15 años' };
var slider = document.getElementById('inflacion');
slider.addEventListener('input', function () {
  document.getElementById('inflacion-txt').textContent = pct(Number(slider.value));
  document.getElementById('explicacion').textContent = 'Elige una respuesta y aquí verás por qué.';
});
document.querySelectorAll('button[data-op]').forEach(function (b) {
  b.addEventListener('click', function () {
    var i = Number(slider.value);
    var ahorro = Number(document.getElementById('ahorro').value);
    var correcta = window.verificar({ inflacion: i, ahorro: ahorro });
    var n = anios(i);
    var valor = ahorro / Math.pow(1 + i / 100, Math.round(n));
    var txt = (b.dataset.op === correcta ? 'Correcto. ' : 'No: lo correcto era ' + nombres[correcta] + '. ') +
      'Con una inflación de ' + pct(i) + ', ' + eur(ahorro) + ' compran la mitad al cabo de unos ' +
      n.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' años (' +
      eur(ahorro) + ' ÷ (1 + ' + (i / 100).toLocaleString('es-ES') + ')^' + Math.round(n) + ' ≈ ' + eur(valor) +
      '). Mueve la inflación y mira dónde se cruzan los 5 y los 15 años.';
    document.getElementById('explicacion').textContent = txt;
  });
});
</script>
</body>
</html>
