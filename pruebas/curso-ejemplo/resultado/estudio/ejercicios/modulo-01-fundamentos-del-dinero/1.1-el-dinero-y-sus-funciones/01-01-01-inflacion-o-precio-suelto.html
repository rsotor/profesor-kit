<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inflación o precio suelto</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8884; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  button { font: inherit; padding: .5rem .9rem; margin: .25rem .25rem .25rem 0; border-radius: 6px; border: 1px solid #8888; cursor: pointer; }
  .bien { background: #2e7d3240; }
  .mal { background: #c6282840; }
  .vacio { opacity: .7; }
</style>
</head>
<body>
<h1>Inflación o precio suelto</h1>
<p>Concepto: <a href="../../../conceptos/inflacion.md">inflación</a> · Sesión 01-01-01</p>

<section>
  <h2>Condiciones</h2>
  <p id="caso"></p>
  <p><button id="otro" type="button">Otro caso</button> <span id="contador"></span></p>
</section>

<section>
  <h2>Reto</h2>
  <p>¿Es inflación lo que describe el caso? <em>(elige una opción)</em></p>
  <button id="si" type="button">Sí, es inflación</button>
  <button id="no" type="button">No, es la subida de un precio suelto</button>
</section>

<section>
  <h2>Explicación</h2>
  <p id="expl" class="vacio">Elige una respuesta y aquí verás por qué.</p>
</section>

<script>
const CASOS = [
  { texto: "Una plaga arruina la cosecha de café. El café pasa de 1,50 € a 1,80 € la taza. El resto de precios no se mueve.",
    inflacion: false,
    por: "Sube un solo producto por una causa propia (la plaga). Inflación es que suba el nivel general de precios, y aquí el resto sigue igual." },
  { texto: "En el último año, la comida, el alquiler, la luz y el transporte suben entre un 2 % anual y un 4 % anual.",
    inflacion: true,
    por: "Suben casi todos los precios a la vez y durante un año entero: es una subida general y sostenida." },
  { texto: "Un modelo de zapatillas se pone de moda y pasa de 80,00 € a 120,00 €. Lo demás cuesta lo mismo.",
    inflacion: false,
    por: "Es una subida enorme, pero de una sola cosa y por moda. El tamaño de la subida no decide si es inflación: decide que sea general." },
  { texto: "Los precios de casi todo en un país suben un 5 % anual, año tras año.",
    inflacion: true,
    por: "Es general y sostenida. Con 5 % anual, 100,00 € de hoy compran cada año menos que el anterior." },
  { texto: "El alquiler en tu barrio sube un 10 % anual porque hay pocos pisos. La comida, la luz y el transporte cuestan lo mismo.",
    inflacion: false,
    por: "Sube fuerte, pero por escasez de una cosa concreta. No es el nivel general de precios." }
];
let i = -1, respondido = false;
const $ = id => document.getElementById(id);
function nuevo() {
  let n; do { n = Math.floor(Math.random() * CASOS.length); } while (n === i);
  i = n; respondido = false;
  $("caso").textContent = CASOS[i].texto;
  $("expl").textContent = "Elige una respuesta y aquí verás por qué.";
  $("expl").className = "vacio";
  $("si").className = ""; $("no").className = "";
}
function responde(dijoSi) {
  const c = CASOS[i], ok = dijoSi === c.inflacion;
  $("expl").className = "";
  $("expl").textContent = (ok ? "Correcto. " : "No. ") + (c.inflacion ? "Sí es inflación. " : "No es inflación. ") + c.por;
  (dijoSi ? $("si") : $("no")).className = ok ? "bien" : "mal";
}
$("si").onclick = () => responde(true);
$("no").onclick = () => responde(false);
$("otro").onclick = nuevo;
nuevo();
</script>
</body>
</html>
