<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llega tarde al ahorro</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  h2 { margin-top: 0; font-size: 1.1rem; }
  label { display: block; margin: .6rem 0; }
  input[type=range] { width: 100%; }
  button { display: block; width: 100%; margin: .4rem 0; padding: .6rem; font-size: 1rem; text-align: left; }
  #explicacion { min-height: 3rem; }
</style>
</head>
<body>
<h1>Llega tarde al ahorro</h1>
<p>Conceptos: <a href="../../../conceptos/horizonte-temporal.md">horizonte-temporal</a> · <a href="../../../conceptos/aportacion-periodica.md">aportacion-periodica</a></p>
<p>Ana ahorra durante 30 años. Luis ahorra lo mismo, pero empieza más tarde. Las aportaciones son al final de cada año.</p>

<section>
  <h2>1 · Condiciones</h2>
  <label>Aportación de Ana al año: <b id="vA">2.400,00 €</b>
    <input type="range" id="A" min="1200" max="6000" step="100" value="2400"></label>
  <label>Tipo anual (el mismo para los dos): <b id="vT">5,0 % anual</b>
    <input type="range" id="T" min="1" max="8" step="0.5" value="5"></label>
  <label>Años que Luis empieza más tarde: <b id="vR">5 años</b>
    <input type="range" id="R" min="1" max="20" step="1" value="5"></label>
  <label>Aportación de Luis al año: <b id="vL">2.900,00 €</b>
    <input type="range" id="L" min="1200" max="9000" step="100" value="2900"></label>
</section>

<section>
  <h2>2 · Reto</h2>
  <p id="pregunta"></p>
  <div id="opciones"></div>
</section>

<section>
  <h2>3 · Explicación</h2>
  <div id="explicacion">Elige una respuesta y aquí verás por qué.</div>
</section>

<script>
function eur(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function num(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function anios(n) { return n + (n === 1 ? ' año' : ' años'); }

// Capital al final de n años con aportación al final de cada año: C = C * (1 + i) + A, año a año
function capital(aport, tipoPct, n) {
  var c = 0, i = tipoPct / 100;
  for (var k = 0; k < n; k++) c = c * (1 + i) + aport;
  return c;
}

function calcular(caso) {
  var A = Number(caso.A), T = Number(caso.T), R = Number(caso.R), L = Number(caso.L);
  var ana = capital(A, T, 30);
  var luis = capital(L, T, 30 - R);
  var alcanza = Math.round(luis * 100) >= Math.round(ana * 100);
  var opciones = [
    { id: 'si', texto: 'Sí, Luis llega a lo mismo que Ana o más', ok: alcanza },
    { id: 'no', texto: 'No, Luis se queda por debajo de Ana', ok: !alcanza },
  ];
  return { ana: ana, luis: luis, correcta: alcanza ? 'si' : 'no', opciones: opciones };
}

// La respuesta correcta ('si' o 'no'), con los mismos campos (ids) que los controles
window.verificar = function (caso) { return calcular(caso).correcta; };

function leer() {
  return { A: document.getElementById('A').value, T: document.getElementById('T').value,
           R: document.getElementById('R').value, L: document.getElementById('L').value };
}

function pintar() {
  var c = leer();
  document.getElementById('vA').textContent = eur(Number(c.A));
  document.getElementById('vT').textContent = num(Number(c.T)) + ' % anual';
  document.getElementById('vR').textContent = anios(Number(c.R));
  document.getElementById('vL').textContent = eur(Number(c.L));
  document.getElementById('pregunta').textContent =
    'Ana aporta ' + eur(Number(c.A)) + ' al año durante 30 años. Luis empieza ' + anios(Number(c.R)) +
    ' después (ahorra ' + anios(30 - Number(c.R)) + ') y aporta ' + eur(Number(c.L)) + ' al año. Al tipo de ' +
    num(Number(c.T)) + ' % anual, ¿Luis la alcanza al final? (elige una)';
  var cont = document.getElementById('opciones');
  cont.innerHTML = '';
  calcular(c).opciones.forEach(function (o) {
    var b = document.createElement('button');
    b.textContent = o.texto;
    b.onclick = function () { responder(o.id); };
    cont.appendChild(b);
  });
  document.getElementById('explicacion').textContent = 'Elige una respuesta y aquí verás por qué.';
}

function responder(id) {
  var c = leer(), r = calcular(c);
  var dif = r.luis - r.ana;
  var txt = (id === r.correcta ? 'Correcto. ' : 'No. ') +
    'Ana acaba con ' + eur(r.ana) + ' y Luis con ' + eur(r.luis) + '. ';
  if (dif >= 0) txt += 'Luis la supera por ' + eur(dif) + ': compensa el retraso aportando más. Prueba a restarle años de ahorro o a bajarle la aportación y verás dónde se invierte.';
  else txt += 'Luis se queda ' + eur(-dif) + ' por debajo. Los años que pierde son los que más intereses darían; sube su aportación hasta que se invierta el resultado y verás cuánto más tiene que aportar.';
  document.getElementById('explicacion').textContent = txt;
}

['A', 'T', 'R', 'L'].forEach(function (k) { document.getElementById(k).addEventListener('input', pintar); });
pintar();
</script>
</body>
</html>
