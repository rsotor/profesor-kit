<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple frente a compuesto</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  section { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  h2 { margin-top: 0; font-size: 1.1rem; }
  label { display: block; margin: .6rem 0; }
  input[type=range] { width: 100%; }
  button { display: block; width: 100%; margin: .4rem 0; padding: .6rem; font-size: 1rem; text-align: left; }
  #explicacion { min-height: 3rem; }
</style>
</head>
<body>
<h1>Simple frente a compuesto</h1>
<p>Conceptos: <a href="../../../conceptos/interes-compuesto.md">interes-compuesto</a> · <a href="../../../conceptos/interes-simple.md">interes-simple</a></p>

<section>
  <h2>1 · Condiciones</h2>
  <label>Capital inicial: <b id="vC">1.000,00 €</b>
    <input type="range" id="C" min="500" max="5000" step="100" value="1000"></label>
  <label>Tipo de interés: <b id="vI">5,0 % anual</b>
    <input type="range" id="i" min="0" max="10" step="0.5" value="5"></label>
  <label>Años: <b id="vN">3 años</b>
    <input type="range" id="n" min="1" max="40" step="1" value="3"></label>
</section>

<section>
  <h2>2 · Reto</h2>
  <p id="pregunta"></p>
  <div id="opciones"></div>
</section>

<section>
  <h2>3 · Explicación</h2>
  <div id="explicacion">Elige una respuesta y aquí verás por qué.</div>
</section>

<script>
function eur(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function num(x) { return String(x).replace('.', ','); }

// Capital C (€), tipo anual i (en %), n años. Simple: C + C*i*n. Compuesto: C*(1+i)^n.
// Veredicto: 'igual' (sin ventaja), 'pequena' (ventaja < una décima parte del capital) o 'grande' (>= una décima parte).
window.verificar = function (caso) { return calcular(caso).correcta; };

function calcular(caso) {
  var C = Number(caso.C), i = Number(caso.i) / 100, n = Number(caso.n);
  var simple = C + C * i * n;
  var compuesto = C * Math.pow(1 + i, n);
  var ventaja = compuesto - simple;
  var correcta;
  if (n === 1 || i === 0) correcta = 'igual';
  else if (ventaja * 10 >= C) correcta = 'grande';
  else correcta = 'pequena';
  var opciones = [
    { id: 'igual', texto: 'Acaban igual: no hay ventaja del compuesto', ok: correcta === 'igual' },
    { id: 'pequena', texto: 'El compuesto gana, pero por menos de una décima parte del capital', ok: correcta === 'pequena' },
    { id: 'grande', texto: 'El compuesto gana por una décima parte del capital o más', ok: correcta === 'grande' }
  ];
  return { simple: simple, compuesto: compuesto, ventaja: ventaja, correcta: correcta, opciones: opciones };
};

function leer() {
  return { C: document.getElementById('C').value, i: document.getElementById('i').value, n: document.getElementById('n').value };
}

function pintar() {
  var c = leer();
  document.getElementById('vC').textContent = eur(Number(c.C));
  document.getElementById('vI').textContent = num(c.i) + ' % anual';
  document.getElementById('vN').textContent = c.n + (Number(c.n) === 1 ? ' año' : ' años');
  document.getElementById('pregunta').textContent =
    'Pones ' + eur(Number(c.C)) + ' a ' + num(c.i) + ' % anual durante ' + c.n + (Number(c.n) === 1 ? ' año' : ' años') +
    ', una vez con interés simple y otra con compuesto. ¿Cómo acaban? (elige una)';
  var cont = document.getElementById('opciones');
  cont.innerHTML = '';
  calcular(c).opciones.forEach(function (o) {
    var b = document.createElement('button');
    b.textContent = o.texto;
    b.onclick = function () { responder(o.id); };
    cont.appendChild(b);
  });
  document.getElementById('explicacion').textContent = 'Elige una respuesta y aquí verás por qué.';
}

function responder(id) {
  var c = leer(), r = calcular(c);
  var txt = (id === r.correcta ? 'Correcto. ' : 'No. ') +
    'Simple: ' + eur(r.simple) + '. Compuesto: ' + eur(r.compuesto) + '. Diferencia: ' + eur(r.ventaja) + '. ';
  if (r.correcta === 'igual') {
    txt += Number(c.n) === 1
      ? 'Con 1 año aún no hay intereses que reinvertir: los dos dan lo mismo.'
      : 'Con tipo 0 no hay intereses que reinvertir: los dos dan lo mismo.';
  } else if (r.correcta === 'pequena') {
    txt += 'Todavía es poco. Alarga los años o sube el tipo: la ventaja crece cada vez más deprisa.';
  } else {
    txt += 'El compuesto reinvierte sus intereses y el simple no: ya se nota.';
  }
  document.getElementById('explicacion').textContent = txt;
}

['C', 'i', 'n'].forEach(function (k) { document.getElementById(k).addEventListener('input', pintar); });
pintar();
</script>
</body>
</html>
